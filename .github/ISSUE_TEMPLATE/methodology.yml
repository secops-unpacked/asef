name: Propose a methodology or scoring change
description: Improve how evaluation evidence is interpreted.
title: "[Methodology] "
body:
  - type: markdown
    attributes:
      value: "Explain the practitioner impact. Do not attach private evaluations or propose vendor rankings without evidence."
  - type: textarea
    id: problem
    attributes:
      label: Problem with the current method
      description: Link the section and describe a concrete example.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change and rationale
      description: Explain what should change and why it is fair across offerings.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Evidence, tradeoffs and historical compatibility
      description: Explain which old evaluations or IDs would be affected, and whether the change belongs in a new version.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Relevant affiliation
      description: State relevant vendor/commercial ties, or “None”.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Before submitting
      options:
        - label: I have the rights to share this material for inclusion under CC BY 4.0, and it contains no confidential information.
          required: true
